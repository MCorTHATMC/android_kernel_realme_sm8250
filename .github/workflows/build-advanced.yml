name: Advanced Kernel CI

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE_URL: 'https://github.com/MCorTHATMC/android_kernel_realme_sm8250'
  KERNEL_BRANCH: 'Entropy-1.6'
  KERNEL_DEFCONFIG: 'vendor/kona-perf_defconfig'
  CLANG_VERSION: 'r416183b'
  ANYKERNEL_BRANCH: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 4096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libssl-dev libcrypto++-dev libncurses5-dev libncursesw5-dev libglib2.0-dev libpixman-1-dev bison flex python3 python3-pip zip unzip git ccache libelf-dev clang lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: ${{ env.KERNEL_SOURCE_URL }}
        ref: ${{ env.KERNEL_BRANCH }}
        path: kernel

    - name: Build Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        make O=out ${{ env.KERNEL_DEFCONFIG }}
        make O=out -j$(nproc) Image.gz-dtb dtbo.img

    - name: Pack AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b ${{ env.ANYKERNEL_BRANCH }} $GITHUB_WORKSPACE/AnyKernel3
        cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/AnyKernel3/
        cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtbo.img $GITHUB_WORKSPACE/AnyKernel3/
        cd $GITHUB_WORKSPACE/AnyKernel3
        zip -r9 ../Kernel-Release.zip *

    - name: Upload Zip
      uses: actions/upload-artifact@v4
      with:
        name: Built-Kernel
        path: ./Kernel-Release.zip
