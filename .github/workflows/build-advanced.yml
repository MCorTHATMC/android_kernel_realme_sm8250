name: Advanced Kernel CI

on:
  workflow_dispatch:

env:
  KERNEL_DEFCONFIG: 'vendor/kona-perf_defconfig'
  ANYKERNEL_BRANCH: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 4096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        # 补充了 4.19 宿主机编译可能需要的额外 C 库
        sudo apt-get install -y bc build-essential libssl-dev libncurses5-dev libncursesw5-dev \
          bison flex python3 python3-pip zip unzip git ccache libelf-dev libc6-dev-i386 linux-libc-dev

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang $GITHUB_WORKSPACE/proton-clang

    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        path: kernel

    - name: Build Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel
        export PATH=$GITHUB_WORKSPACE/proton-clang/bin:$PATH
        export ARCH=arm64

        # mkdtboimg.py 需要 python 命令
        sudo ln -sf /usr/bin/python3 /usr/bin/python

        # 修复 schgm-flash.c: 移除 OPLUS_FEATURE_CHG_BASIC 条件编译,
        # 否则 smb5-lib.h(定义了 smb_charger/smb_irq_data 结构体) 不会被包含
        sed -i '/#ifndef OPLUS_FEATURE_CHG_BASIC/,/#endif/{
          /#ifndef OPLUS_FEATURE_CHG_BASIC/d
          /#endif/d
        }' drivers/power/supply/qcom/schgm-flash.c

        # 生成基础 defconfig
        make LLVM=1 O=out ${{ env.KERNEL_DEFCONFIG }}

        # 合并 oplus.config (Oplus 充电/指纹/触屏/工程模式等必须模块)
        cat arch/arm64/configs/vendor/oplus.config >> out/.config
        make LLVM=1 O=out olddefconfig

        # 编译内核 + 设备树
        make LLVM=1 O=out -j$(nproc) \
          KCFLAGS='-Wno-error=implicit-function-declaration -Wno-error=visibility -Wno-error=incompatible-pointer-types' \
          Image.gz-dtb dtbo.img
            
    - name: Pack AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b ${{ env.ANYKERNEL_BRANCH }} $GITHUB_WORKSPACE/AnyKernel3
        
        cd $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/
        
        # 自动寻找 Image 开头的文件（如 Image.gz-dtb 或 Image.gz）并复制
        IMAGE=$(find . -maxdepth 1 -name "Image*" | head -n 1)
        if [ -n "$IMAGE" ]; then
            cp $IMAGE $GITHUB_WORKSPACE/AnyKernel3/
            echo "✅ 成功找到并复制内核镜像: $IMAGE"
        else
            echo "❌ 未能找到内核内核镜像文件！" && exit 1
        fi
        
        # 复制 dtbo.img
        DTBO=$(find . -name "dtbo.img" | head -n 1)
        if [ -n "$DTBO" ]; then
            cp $DTBO $GITHUB_WORKSPACE/AnyKernel3/
            echo "✅ 成功找到并复制 DTBO: $DTBO"
        else
            echo "⚠️ 未找到 dtbo.img，将跳过 dtbo 打包（部分机型可能不需要）"
        fi

        # 生成正确的 anykernel.sh（跳过设备检查，SM8250 分区路径）
        cat > $GITHUB_WORKSPACE/AnyKernel3/anykernel.sh << 'AKEOF'
        ### AnyKernel3 Ramdisk Mod Script
        ## osm0sis @ xda-developers
        properties() { '
        kernel.string=Realme SM8250 (Kona) Kernel
        do.devicecheck=0
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        supported.versions=
        supported.patchlevels=
        supported.vendorpatchlevels=
        '; }
        boot_attributes() {
        set_perm_recursive 0 0 755 644 \$RAMDISK/*;
        set_perm_recursive 0 0 750 750 \$RAMDISK/init* \$RAMDISK/sbin;
        }
        BLOCK=/dev/block/bootdevice/by-name/boot;
        IS_SLOT_DEVICE=0;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=auto;
        . tools/ak3-core.sh;
        dump_boot;
        write_boot;
        DTBO_BLOCK=/dev/block/bootdevice/by-name/dtbo;
        if [ -f dtbo.img ] && [ -b "\$DTBO_BLOCK" ]; then
          ui_print "Flashing dtbo.img to dtbo partition...";
          dd if=dtbo.img of=\$DTBO_BLOCK bs=4k;
        fi
        AKEOF

        # 开始打包
        cd $GITHUB_WORKSPACE/AnyKernel3
        zip -r9 ../Kernel-Release.zip * -x '.git*' 'README.md'

    - name: Upload Zip
      uses: actions/upload-artifact@v4
      with:
        name: Built-Kernel
        path: ./Kernel-Release.zip